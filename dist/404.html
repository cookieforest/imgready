<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | imgready</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b84d1d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#000000">
<link rel="preload" href="/fonts/poetsenone-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<style>
  /* Everything here rides on app.css tokens. This page used to carry its
     own hardcoded palette (pale green) and its own @font-face blocks
     pointing at Fraunces and Inter — two files that no longer exist, so
     it was fetching two 404s from the 404 page and falling back to
     Georgia. Tokens only from here on. */
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;margin:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .brand{
    font-family:var(--font-display);font-synthesis:none;font-weight:400;
    font-feature-settings:"ss01" on;
    font-size:28px;letter-spacing:0;
    text-decoration:none;color:var(--text);
    margin-bottom:32px;display:block;
  }
  .brand span{color:var(--accent);}
  h1{font-family:var(--font-display);font-synthesis:none;font-weight:400;font-size:2.2rem;color:var(--text);margin:0 0 12px;}
  p{font-size:1rem;color:var(--text2);line-height:1.7;max-width:480px;margin:0 0 28px;}
  .links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:520px;}
  .btn{
    display:inline-block;padding:12px 24px;
    background:var(--accent);color:var(--on-accent);
    border:2px solid var(--accent);
    border-radius:10px;font-size:.9rem;font-weight:700;
    text-decoration:none;transition:background .2s,color .2s;
  }
  .btn:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
  .btn.ghost{background:transparent;color:var(--accent);}
  .btn.ghost:hover{background:var(--accent);color:var(--on-accent);}
</style>
</head>
<body>
  <a class="brand" href="/">img<i class="brand-mark" aria-hidden="true"></i><span>ready</span></a>
  <h1>Page not found</h1>
  <p>That URL doesn't exist. Try one of the tools below, or head back home.</p>
  <div class="links">
    <a class="btn" href="/">Home</a>
    <a class="btn ghost" href="/compress/">Compress</a>
    <a class="btn ghost" href="/resize/">Resize</a>
    <a class="btn ghost" href="/webp-converter/">Convert to WebP</a>
    <a class="btn ghost" href="/heic-to-jpg/">HEIC to JPG</a>
    <a class="btn ghost" href="/avif-converter/">Convert to AVIF</a>
  </div>
</body>
</html>
