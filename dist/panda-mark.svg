<!-- ===========================================================================
     imgready brand mark === red panda silhouette, winking, tongue out.

     DO NOT HAND===EDIT THIS FILE. It is derived from
     panda===mark===editable.svg, which is the source of truth. Edit that
     one in Illustrator, save, and this gets regenerated from it.

     HOW IT IS USED
     Never displayed directly. app.css applies it as a CSS mask over
     currentColor (see .brand===mark), so ONLY THE ALPHA MATTERS === the
     #000 fill at the bottom is arbitrary. The colour comes from CSS,
     which is why one file works on the cream pages and on the dark
     canvas, where the accent token remaps to a lighter rust.

     DERIVATION RULE
       every .st0 (rust) shape in the editable file  ==>  white here (fur)
       every .st1 (cream) shape in the editable file ==>  black here (hole)
     Cream is never painted here. It is absence, so the page colour shows
     through, which is what makes the mark work on any background.

     COORDINATES are Illustrator's 0 0 560 450 space, unchanged from the
     editable file. That is the same 1.2444 ratio as the old 56x45 grid,
     so app.css needs no change: width:1.269em, height:1.02em.

     NOTE: the editable file carries the right eye twice (ids "eye===right"
     and "eye===right1", identical ellipses stacked). Only one is needed,
     so only one is here. Harmless either way, but worth deleting upstream.

     XML comments may not contain a double hyphen, hence the "===".
     =========================================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450">
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="450">
    <rect width="560" height="450" fill="#000"/>

    <!-- ==== FUR (white = mark shows) =============================== -->
    <g fill="#fff">
      <path id="ear-left" d="M56,16c-22.7,62.7-23.3,127.3-2,194,50.7-29.3,95.3-72.7,134-130C146.7,36,102.7,14.7,56,16Z"/>
      <path id="ear-right" d="M504,16c22.7,62.7,23.3,127.3,2,194-50.7-29.3-95.3-72.7-134-130,41.3-44,85.3-65.3,132-64Z"/>
      <path id="head" d="M280,40c122,0,222,76,236,174l34,52c-20,62-58,110-120,138-46,20-96,28-150,28s-104-8-150-28c-62-28-100-76-120-138l34-52c14-98,114-174,236-174Z"/>
    </g>

    <!-- ==== FEATURES (black = cut through, reads as the page) ======= -->
    <g fill="#000">
      <!-- ear interiors -->
      <path d="M77.6,156.9c-3.9-13.5-8-33.7-6.7-58.3,1-19,5-34.9,8.9-46.4,7.4.3,19.7,1.6,33.4,7.8,13.3,6,22.4,14,27.5,19.3-9.9,8.5-20.7,19.1-31.6,31.9-13.8,16.3-24,32.1-31.6,45.7Z"/>
      <path d="M482.4,156.9c3.9-13.5,8-33.7,6.7-58.3-1-19-5-34.9-8.9-46.4-7.4.3-19.7,1.6-33.4,7.8-13.3,6-22.4,14-27.5,19.3,9.9,8.5,20.7,19.1,31.6,31.9,13.8,16.3,24,32.1,31.6,45.7Z"/>

      <!-- left eye, winking -->
      <path id="eye-left-wink" d="M155.2,234.5c.8-1,6.1,2.2,17.8,9.1,11.4,6.7,28.1,17,50.3,30.9-48.4,21.5-73.2,31.1-74.3,28.7-1-1.9,13.9-11.9,44.6-29.8-20-18-40-36.9-38.4-38.9Z"/>
      <!-- right eye, open -->
      <ellipse id="eye-right" cx="373.6" cy="270.4" rx="29.5" ry="37"/>

      <path id="nose" d="M307.1,305.8c1,2,1.1,3.9,1.1,4.4.3,10-14.7,17-18,18.6-5.6,2.7-9,2.8-10.6,2.7-1.9,0-4.5-.4-9-2.4-3.3-1.5-19.2-8.8-18.8-18.9,0-2.5,1.1-4.3,1.5-5,8.1-13.9,47-12.9,53.8.6Z"/>
      <path id="mouth" d="M247.7,345.4c.5-1.4,14.8,6.6,36.1,4.9,18.5-1.5,30-9.3,30.6-8,.7,1.4-12.5,13.4-30.2,15.1-20.1,1.9-37.1-10.5-36.5-12Z"/>
      <path id="tongue" d="M282.6,352.9c-4.9,22.1,7.1,39.9,20,41.8,9.8,1.4,20.5-6.2,24.8-15.9,5.4-12.3.7-28-12.3-36.8-4.7,1.6-9.4,3.2-14.1,4.7,3.1,2.9,7.2,7.6,9.6,14.6,4,11.6,1,23.5-.4,23.5-1.1,0-.7-8.5-5.2-20.8-2.6-7-5.7-12.4-8-15.9-4.8,1.6-9.7,3.3-14.5,4.9Z"/>
    </g>
  </mask>

  <rect width="560" height="450" fill="#000000" mask="url(#m)"/>
</svg>
