<!-- Safari pinned-tab mask. Safari wants a single-layer, 100% black
     silhouette on transparent and tints it itself with the colour on
     <link rel="mask-icon">, so all the fur colour is dropped and only
     the outline survives: ears plus the head dome, from the SMALL cut,
     since pinned tabs are tab-sized. Solid shapes only — no even-odd
     knockout, because Safari's handling of compound paths here is not
     worth relying on. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <path d="M9.6 10.6 Q 6.2 20 9.4 30 Q 17 25.6 22.8 17 Q 16.6 10.4 9.6 10.6 Z" fill="#000000"/>
  <path d="M54.4 10.6 Q 57.8 20 54.6 30 Q 47 25.6 41.2 17 Q 47.4 10.4 54.4 10.6 Z" fill="#000000"/>
  <path d="M32 13
           C 44.2 13, 54.2 20.6, 55.6 30.4
           L 59 35.6
           C 57 41.8, 53.2 46.6, 47 49.4
           C 42.4 51.4, 37.4 52.2, 32 52.2
           C 26.6 52.2, 21.6 51.4, 17 49.4
           C 10.8 46.6, 7 41.8, 5 35.6
           L 8.4 30.4
           C 9.8 20.6, 19.8 13, 32 13 Z" fill="#000000"/>
</svg>
