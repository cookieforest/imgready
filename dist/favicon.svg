<!-- imgready mascot, SMALL cut. What browsers put in the tab strip, so
     it is drawn for 16-20px and nothing else. Chrome prefers an SVG
     favicon over the .ico when both are offered, so the tab always
     renders THIS file — downscaling the large cut here would lose the
     face to sub-pixel mush however good the .ico is.

     Same mark as favicon-large.svg with the sub-pixel detail stripped:
     no blush, no smile, no brow flashes, no rust wedge in the ears. At
     16px one unit of this 64 grid is a quarter of a pixel, so the large
     cut's 1.15-unit smile stroke is under a third of a pixel.

     Kept and enlarged: pointed ears with white interiors (the thing
     that says red panda and not mouse), the sickles, the muzzle, and
     eyes at 3.2 units so they land near 1.6px across at 16. The head is
     scaled up slightly to spend less of the tile on padding. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="imgready">
  <rect width="64" height="64" rx="13" fill="#faecd8"/>

  <g stroke="#cf5f28" stroke-width="2.4" stroke-linejoin="round">
    <path d="M9.6 10.6 Q 6.2 20 9.4 30 Q 17 25.6 22.8 17 Q 16.6 10.4 9.6 10.6 Z" fill="#ffffff"/>
    <path d="M54.4 10.6 Q 57.8 20 54.6 30 Q 47 25.6 41.2 17 Q 47.4 10.4 54.4 10.6 Z" fill="#ffffff"/>
  </g>

  <path d="M32 13
           C 44.2 13, 54.2 20.6, 55.6 30.4
           L 59 35.6
           C 57 41.8, 53.2 46.6, 47 49.4
           C 42.4 51.4, 37.4 52.2, 32 52.2
           C 26.6 52.2, 21.6 51.4, 17 49.4
           C 10.8 46.6, 7 41.8, 5 35.6
           L 8.4 30.4
           C 9.8 20.6, 19.8 13, 32 13 Z"
        fill="#e8722f" stroke="#cf5f28" stroke-width="2.4" stroke-linejoin="round"/>

  <g fill="#ffffff">
    <path d="M14.6 32.6 Q 11.6 44, 19.6 49.6 Q 15.2 42.6, 17.8 35.4 Q 16.6 32.6, 14.6 32.6 Z"/>
    <path d="M49.4 32.6 Q 52.4 44, 44.4 49.6 Q 48.8 42.6, 46.2 35.4 Q 47.4 32.6, 49.4 32.6 Z"/>
  </g>

  <path d="M32 32 Q 40.4 32.8, 42.8 40.2 Q 44.6 48.6, 32 49.8 Q 19.4 48.6, 21.2 40.2 Q 23.6 32.8, 32 32 Z"
        fill="#ffffff"/>

  <ellipse cx="24.2" cy="34.6" rx="3.2" ry="3.8" fill="#3e2419"/>
  <ellipse cx="39.8" cy="34.6" rx="3.2" ry="3.8" fill="#3e2419"/>
  <path d="M32 42.6 Q 27.6 40.4, 28.3 37.8 Q 29.7 36.1, 32 36.8 Q 34.3 36.1, 35.7 37.8 Q 36.4 40.4, 32 42.6 Z"
        fill="#3e2419"/>
</svg>
