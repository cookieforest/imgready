<!-- imgready mascot, LARGE cut — head only. Source for apple-touch-icon
     (180) and the 192/512 PWA icons. Traced from the supplied reference
     illustration.

     Structure, in paint order: ears sit BEHIND the head so the head
     overlaps their base, then the head dome, then the white markings,
     then blush, then the face.

     The darker rim (#cf5f28) around the head and ears is doing real
     work, not decoration. The body orange #e8722f is only ~2.6:1
     against this cream field, which is under the 3:1 a graphic needs;
     the rim is ~3.4:1 and is what actually holds the silhouette
     together, especially once this is scaled down. Don't drop it.

     White markings never cross the outline — white on cream is ~1.1:1,
     so anything that escaped the orange would erase the edge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="imgready">
  <rect width="64" height="64" rx="13" fill="#faecd8"/>

  <!-- EARS (behind the head) -->
  <g stroke="#cf5f28" stroke-width="2" stroke-linejoin="round">
    <path d="M10.6 12.2 Q 7.4 21 10.4 30.4 Q 17.4 26.4 22.6 18.4 Q 17 12 10.6 12.2 Z" fill="#ffffff"/>
    <path d="M53.4 12.2 Q 56.6 21 53.6 30.4 Q 46.6 26.4 41.4 18.4 Q 47 12 53.4 12.2 Z" fill="#ffffff"/>
  </g>
  <!-- rust wedge inside each ear -->
  <g fill="#e8722f">
    <path d="M13.2 17.4 Q 17.4 22 19.4 19.6 Q 16.6 15.4 13.2 17.4 Z"/>
    <path d="M50.8 17.4 Q 46.6 22 44.6 19.6 Q 47.4 15.4 50.8 17.4 Z"/>
  </g>

  <!-- HEAD: dome with a fur point on each side -->
  <path d="M32 14.2
           C 43.4 14.2, 52.8 21.4, 54.2 30.6
           L 57.4 35.4
           C 55.4 41.2, 52 45.6, 46 48.2
           C 41.6 50.1, 37 50.9, 32 50.9
           C 27 50.9, 22.4 50.1, 18 48.2
           C 12 45.6, 8.6 41.2, 6.6 35.4
           L 9.8 30.6
           C 11.2 21.4, 20.6 14.2, 32 14.2 Z"
        fill="#e8722f" stroke="#cf5f28" stroke-width="2" stroke-linejoin="round"/>

  <!-- blush, under the sickles -->
  <g fill="#e8927c" opacity="0.55">
    <ellipse cx="21.6" cy="40.4" rx="4.4" ry="3.4"/>
    <ellipse cx="42.4" cy="40.4" rx="4.4" ry="3.4"/>
  </g>

  <!-- SICKLE cheeks: thick crescents tapering to points -->
  <g fill="#ffffff">
    <path d="M15.6 33.2 Q 13.2 43.4 20.4 48.2 Q 16.6 42.2 18.6 35.6 Q 17.4 33.2 15.6 33.2 Z"/>
    <path d="M48.4 33.2 Q 50.8 43.4 43.6 48.2 Q 47.4 42.2 45.4 35.6 Q 46.6 33.2 48.4 33.2 Z"/>
  </g>

  <!-- MUZZLE: rounded triangle -->
  <path d="M32 32.6 Q 39.6 33.4 41.8 40 Q 43.4 47.6 32 48.6 Q 20.6 47.6 22.2 40 Q 24.4 33.4 32 32.6 Z"
        fill="#ffffff"/>

  <!-- brow flashes -->
  <g fill="#ffffff">
    <ellipse cx="23.4" cy="28.6" rx="3.4" ry="2.1" transform="rotate(-14 23.4 28.6)"/>
    <ellipse cx="40.6" cy="28.6" rx="3.4" ry="2.1" transform="rotate(14 40.6 28.6)"/>
  </g>

  <!-- eyes -->
  <ellipse cx="24.6" cy="35" rx="2.7" ry="3.3" fill="#3e2419"/>
  <ellipse cx="39.4" cy="35" rx="2.7" ry="3.3" fill="#3e2419"/>

  <!-- nose + smile -->
  <path d="M32 41.4 Q 28.2 39.6 28.8 37.4 Q 30 36 32 36.6 Q 34 36 35.2 37.4 Q 35.8 39.6 32 41.4 Z"
        fill="#3e2419"/>
  <path d="M32 41.4 L32 42.8 M28.2 43.4 Q 30.1 45.6 32 42.9 Q 33.9 45.6 35.8 43.4"
        fill="none" stroke="#3e2419" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
