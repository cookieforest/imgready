# Validation gate. Goal: nothing broken ever reaches Cloudflare's
# deploy queue. This is the layer that would have caught the silent
# truncation we hit during P5.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Source size sanity (catches truncation)
        # Each ordered source chunk should be reasonable. If something
        # truncates them later, the next CI run flags the missing bytes.
        run: |
          set -e
          for f in src/*.js; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            [ "$size" -gt 100 ] || { echo "::error::$f looks suspiciously small ($size bytes)"; exit 1; }
          done

      - name: Build
        # Concatenates src/0N-*.js → root/app.js, then bundles → dist/app.js.
        # The build itself fails loudly if any chunk's content can't be
        # joined into a syntactically valid IIFE.
        run: npm run build

      - name: Syntax check (concatenated + built outputs)
        run: |
          set -e
          # Concatenated source (what CF currently serves)
          node --check app.js
          # Bundled minified output (what Phase 3 will serve)
          node --check dist/app.js
          # Worker + service worker stay standalone scripts
          node --check imgready-worker.js
          node --check sw.js
          # Vendor bundles
          for f in vendor/*.js; do node --check "$f"; done
          # Sanity: built artifacts non-empty
          test -s dist/app.js || { echo "dist/app.js empty"; exit 1; }
          test -s dist/app.css || { echo "dist/app.css empty"; exit 1; }

      - name: Verify root copy is in sync with build (Phase 2/4)
        # If someone edited root/app.js without rebuilding, fail.
        # When Phase 3 deletes the root copy, this step becomes a no-op.
        run: |
          if [ -f app.js ] && [ -f src/01-state-helpers.js ]; then
            # Re-concatenate and compare against the committed root/app.js
            cat src/0[0-9]-*.js > /tmp/expected_app.js
            diff -q /tmp/expected_app.js app.js || {
              echo "::error::root/app.js is out of sync with src/0N-*.js — run 'npm run build' and commit the regenerated root/app.js"
              exit 1
            }
          fi
          if [ -f app.css ] && [ -f src/app.css ]; then
            diff -q src/app.css app.css || {
              echo "::error::root/app.css is out of sync with src/app.css"
              exit 1
            }
          fi
