# Validation gate. Goal: nothing broken ever reaches Cloudflare's
# deploy queue. This caught the silent JS-source truncation we hit
# during P5; a later session caught a separate silent HTML truncation
# (the SW registration block dropped its tail without the browser
# complaining). Both kinds of failure are now flagged here.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Source size sanity (catches truncation)
        # Each ordered source chunk should be reasonable. If something
        # truncates them later, the next CI run flags the missing bytes.
        run: |
          set -e
          for f in src/*.js; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            echo "$f: $size bytes"
            [ "$size" -gt 100 ] || { echo "::error::$f looks suspiciously small ($size bytes)"; exit 1; }
          done

      - name: Build
        run: npm run build

      - name: Syntax check (built outputs + sibling scripts)
        run: |
          set -e
          node --check dist/app.js
          node --check imgready-worker.js
          node --check sw.js
          for f in vendor/*.js; do node --check "$f"; done
          test -s dist/app.js
          test -s dist/app.css

      - name: HTML structural integrity (catches silent truncation)
        # Browsers tolerate missing </script></body></html> so HTML
        # truncation can ship invisibly — the page renders but parts
        # of the script may not run. Grep-assert each HTML file ends
        # cleanly + key SW registration symbols are present in the
        # homepage.
        run: |
          set -e
          missing=0
          for f in $(find dist -name '*.html'); do
            tail=$(tail -c 200 "$f")
            if ! echo "$tail" | grep -q '</html>'; then
              echo "::error::$f missing </html> closing tag"
              missing=$((missing+1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          # Homepage-specific structural checks: SW registration block must
          # contain its key entry-point functions, OR the live install
          # prompt won't fire at all.
          for sym in 'acceptInstall' 'maybeShowInstallPrompt' 'dismissInstall' 'beforeinstallprompt'; do
            grep -q "$sym" dist/index.html || {
              echo "::error::dist/index.html missing $sym (SW registration block truncated?)"
              exit 1
            }
          done

      - name: Re-build + diff (catches uncommitted dist drift)
        run: |
          set -e
          rm -rf /tmp/expected_dist
          mkdir -p /tmp/expected_dist
          cp -r dist/* /tmp/expected_dist/
          npm run build
          diff -q /tmp/expected_dist/app.js dist/app.js || {
            echo "::error::dist/app.js drifted from a fresh build — run 'npm run build' and commit the result"
            exit 1
          }
          diff -q /tmp/expected_dist/app.css dist/app.css || {
            echo "::error::dist/app.css drifted from a fresh build"
            exit 1
          }
