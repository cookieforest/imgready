<!-- imgready mark, SMALL-SIZE cut. This is what browsers put in the tab
     strip, so it is drawn for 16-20px and nothing else.

     Chrome prefers an SVG favicon over the .ico when both are offered,
     which means the tab always renders THIS file — a detailed drawing
     here would be downscaled to 16px by the browser and turn to mush no
     matter how good the .ico is. So the detail lives in
     favicon-large.svg, which feeds the 180/192/512 rasters, and this cut
     is deliberately plainer: one triangle, one solid sun, nothing else.

     An earlier version had a second, smaller peak. At 16px the notch
     between the peaks fell below a pixel and the range read as a jagged
     blob — checked by rendering at 16 and magnifying 8x.

     Geometry note: the sun sits clear of the left slope. At y=22 the
     slope is already at x=30, and the sun's disc ends at x=22. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="imgready">
  <rect width="64" height="64" rx="13" fill="#4f6f4f"/>
  <circle cx="16" cy="16" r="6" fill="#ffffff"/>
  <path d="M4 50 L32 20 L60 50 Z" fill="#ffffff"/>
</svg>
