<!-- ===========================================================================
     imgready brand mark === SMALL CUT. Used by the wordmark everywhere.

     WHY THIS EXISTS
     The wordmark renders at 16px (footer), 22px (nav) and 42px (mobile
     header). Measured against the expressive cut at those sizes:

         feature      16px        22px        42px
         mouth        2.4x0.6     3.3x0.8     6.4x1.5
         tongue       1.7x1.9     2.4x2.6     4.6x5.0
         wink         2.7x2.5     3.7x3.5     7.1x6.6
         round eye    2.1x2.7     2.9x3.7     5.6x7.0

     The mouth is under two pixels tall even at 42px, so the expression
     does not survive ANY size the wordmark is used at === it needs about
     64px. Worse, the wink is a thin chevron while the open eye is a
     solid blob, so the wink dissolves first and you get a ONE===EYED
     panda rather than a soft one.

     So: expression is not a wordmark feature. It lives in the large cut
     (panda===mark.svg) wherever the mascot appears at 64px or more.

     Same pattern the favicons already use here: favicon.svg is a small
     cut for the tab strip, favicon===large.svg keeps the detail.

     WHAT CHANGED FROM THE LARGE CUT
       dropped   mouth, tongue, wink
       added     a second symmetric eye, so it is never one===eyed
       enlarged  eyes 59x74 => 68x80, nose 56x36 => 62x48
       kept      head, ears, hollow ear interiors (2.5x3.8 at 16px, fine)

     RULE OF THUMB from the table: at 16px nothing under roughly 55
     viewBox units in its smallest dimension will render. Do not add a
     feature to this cut thinner than that.

     Consumed as a CSS mask over currentColor, so only alpha matters.
     Coordinates are the same 0 0 560 450 space as the large cut.
     XML comments may not contain a double hyphen, hence the "===".
     =========================================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450">
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="560" height="450">
    <rect width="560" height="450" fill="#000"/>

    <!-- ==== FUR (white = mark shows) =============================== -->
    <g fill="#fff">
      <path id="ear-left" d="M56,16c-22.7,62.7-23.3,127.3-2,194,50.7-29.3,95.3-72.7,134-130C146.7,36,102.7,14.7,56,16Z"/>
      <path id="ear-right" d="M504,16c22.7,62.7,23.3,127.3,2,194-50.7-29.3-95.3-72.7-134-130,41.3-44,85.3-65.3,132-64Z"/>
      <path id="head" d="M280,40c122,0,222,76,236,174l34,52c-20,62-58,110-120,138-46,20-96,28-150,28s-104-8-150-28c-62-28-100-76-120-138l34-52c14-98,114-174,236-174Z"/>
    </g>

    <!-- ==== FEATURES (black = cut through to the page) ============== -->
    <g fill="#000">
      <path d="M77.6,156.9c-3.9-13.5-8-33.7-6.7-58.3,1-19,5-34.9,8.9-46.4,7.4.3,19.7,1.6,33.4,7.8,13.3,6,22.4,14,27.5,19.3-9.9,8.5-20.7,19.1-31.6,31.9-13.8,16.3-24,32.1-31.6,45.7Z"/>
      <path d="M482.4,156.9c3.9-13.5,8-33.7,6.7-58.3-1-19-5-34.9-8.9-46.4-7.4.3-19.7,1.6-33.4,7.8-13.3,6-22.4,14-27.5,19.3,9.9,8.5,20.7,19.1,31.6,31.9,13.8,16.3,24,32.1,31.6,45.7Z"/>

      <!-- symmetric pair, mirrored about x=280. Never one eye. -->
      <ellipse id="eye-left"  cx="186.4" cy="270.4" rx="34" ry="40"/>
      <ellipse id="eye-right" cx="373.6" cy="270.4" rx="34" ry="40"/>

      <!-- nose, enlarged from the large cut so it clears the 55 unit floor -->
      <ellipse id="nose" cx="280" cy="316" rx="31" ry="24"/>
    </g>
  </mask>

  <rect width="560" height="450" fill="#000000" mask="url(#m)"/>
</svg>
